name: First Workflow
on:
  push:
    branches:
      - develop

permissions:
  contents: write
  deployments: write
  statuses: write

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pt
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    env:
      DB_HOST: mysql://user:pass@127.0.0.1:3306/appdb
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm ci 

      - name: Start Deployment to Render
        uses: bobheadxi/deployments@v1
        id: deployment-start
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: develop

      - name: Run Nest Build
        run: npm run build
      - name: Run Migrations
        run: npm run typeorm -- migration:run -d src/data-source.ts

      - name: Deploy and Monitor
        id: deploy-render
        run: |
          echo "🚀 Starting deployment..."

          response=$(curl -s -w "%{http_code}" -X POST ${{ secrets.RENDER_DEPLOY_HOOK }})
          http_code=$(echo "$response" | tail -c 4)

          if [ "$http_code" -eq "200" ] || [ "$http_code" -eq "201" ]; then
            echo "✅ Deployment started"

            echo "⏳ Monitoring deployment status..."
            for i in {1..30}; do
              echo "Checking deployment status... (attempt $i/30)"
              sleep 10
            done

            echo "✅ Deployment monitoring completed"
          else
            echo "❌ Failed to start deployment: $http_code"
            exit 1
          fi

          echo "http_code=$http_code" >> $GITHUB_OUTPUT

      - name: Finish Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: develop
          status: success
          deployment_id: ${{ steps.deployment-start.outputs.deployment_id }}
